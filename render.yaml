services:
  - type: web
    name: employee-engagement-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: RAG_AGENT_URL
        sync: false
      - key: RAG_AGENT_TIMEOUT_MS
        value: 185000
      - key: RAG_AGENT_AUTH_HEADER
        sync: false
      - key: RAG_AGENT_AUTH_VALUE
        sync: false
      - key: RAG_AGENT_AUTH_VERIFIED
        value: false
